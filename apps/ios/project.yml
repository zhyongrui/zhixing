name: Zhixing
options:
  bundleIdPrefix: app.zhixing
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    PRODUCT_BUNDLE_IDENTIFIER: app.zhixing.ios
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Info.plist
    APP_API_BASE: http://localhost:8787
targets:
  Zhixing:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - project.yml
          - README.md
          - Info.plist
          - .gitignore
          - Zhixing.xcodeproj
          - Fonts
      - path: Fonts
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: 知行
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 知行
        UIAppFonts:
          - Fonts/NotoSerifSC.ttf
        CFBundleShortVersionString: "0.1.0"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        APIBase: $(APP_API_BASE)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
schemes:
  Zhixing:
    build:
      targets:
        Zhixing: all
